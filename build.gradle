plugins {
    id("java-library")
    id("pmd")
    id("com.diffplug.spotless") version "8.10.4"
}

group = "org.ith"
version = "0.1.0"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(providers.gradleProperty("javaVersion").orElse("25").get())
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = "UTF-8"
    options.compilerArgs.addAll(["-Xlint:all", "-Werror"])
}

repositories {
    mavenCentral()
}

dependencies {
    api("com.squareup.retrofit2:retrofit:3.0.0")
    implementation("com.alibaba.fastjson2:fastjson2-extension:2.0.65")

    api(platform("com.squareup.okhttp3:okhttp-bom:5.5.0"))
    implementation("com.squareup.okhttp3:okhttp")
    // HttpLoggingInterceptor.Level forma parte de la API pública (TuRuc.withLogLevel).
    api("com.squareup.okhttp3:logging-interceptor")

    testImplementation(platform("org.junit:junit-bom:6.1.3"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")

    pmdAux(files(javaToolchains.launcherFor(java.toolchain).map {
        it.metadata.installationPath.file("lib/jrt-fs.jar")
    }))
}

tasks.test {
    useJUnitPlatform()
}

spotless {
    java {
        palantirJavaFormat("2.102.0")
    }
    groovyGradle {
        target("*.gradle")
        greclipse().configProperties("org.eclipse.jdt.core.formatter.tabulation.char=space")
    }
}

pmd {
    toolVersion = "7.28.0"
    ruleSets = []
    ruleSetFiles = files("config/pmd/ruleset.xml")
    consoleOutput = true
}
