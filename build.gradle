import com.vanniktech.maven.publish.JavaLibrary
import com.vanniktech.maven.publish.JavadocJar

plugins {
    id("java-library")
    id("pmd")
    id("com.diffplug.spotless") version "8.10.4"
    id("com.vanniktech.maven.publish") version "0.37.0"
}

group = "py.com.ith"
version = "0.1.0"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(providers.gradleProperty("javaVersion").orElse("25").get())
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = "UTF-8"
    options.compilerArgs.addAll(["-Xlint:all", "-Werror"])
}

repositories {
    mavenCentral()
}

dependencies {
    api("com.squareup.retrofit2:retrofit:3.0.0")
    implementation("com.alibaba.fastjson2:fastjson2-extension:2.0.65")

    api(platform("com.squareup.okhttp3:okhttp-bom:5.5.0"))
    implementation("com.squareup.okhttp3:okhttp")
    implementation("com.squareup.okhttp3:logging-interceptor")

    testImplementation(platform("org.junit:junit-bom:6.1.3"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")

    pmdAux(files(javaToolchains.launcherFor(java.toolchain).map {
        it.metadata.installationPath.file("lib/jrt-fs.jar")
    }))
}

tasks.test {
    useJUnitPlatform()
}

tasks.withType(Javadoc).configureEach {
    options.encoding = "UTF-8"
    options.addBooleanOption("Xdoclint:all,-missing", true)
}

spotless {
    java {
        palantirJavaFormat("2.102.0")
    }
    groovyGradle {
        target("*.gradle")
        greclipse().configProperties("org.eclipse.jdt.core.formatter.tabulation.char=space")
    }
}

pmd {
    toolVersion = "7.28.0"
    ruleSets = []
    ruleSetFiles = files("config/pmd/ruleset.xml")
    consoleOutput = true
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()
    coordinates(project.group.toString(), "tu-ruc-client", project.version.toString())
    configure(new JavaLibrary(new JavadocJar.Javadoc(), true))

    pom {
        name = "Tu RUC Java Client"
        description = "Cliente Java para consultar y buscar contribuyentes en la API de Tu RUC."
        inceptionYear = "2023"
        url = "https://github.com/ithdev/tu-ruc-java-client"
        licenses {
            license {
                name = "MIT License"
                url = "https://opensource.org/license/mit"
                distribution = "repo"
            }
        }
        developers {
            developer {
                id = "ithdev"
                name = "ITH"
                url = "https://ith.com.py"
            }
        }
        scm {
            url = "https://github.com/ithdev/tu-ruc-java-client"
            connection = "scm:git:https://github.com/ithdev/tu-ruc-java-client.git"
            developerConnection = "scm:git:ssh://git@github.com/ithdev/tu-ruc-java-client.git"
        }
    }
}

// Maven Central rechaza artefactos sin firmar; para publicar en Maven local no hace falta firmar.
signing {
    required = {
        gradle.taskGraph.allTasks.any {
            it.name.contains("MavenCentral")
        }
    }
}
